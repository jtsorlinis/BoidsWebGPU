<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Boids</title>
    <script type="module" crossorigin src="/BoidsWebGPU/assets/index-D1F3hcLC.js"></script>
    <link rel="modulepreload" crossorigin href="/BoidsWebGPU/assets/gpu-nS4QaLAx.js">
    <link rel="stylesheet" crossorigin href="/BoidsWebGPU/assets/index-rMRN0wZV.css">
  </head>
  <body>
    <div id="loader">loading...</div>
    <div class="card">
      <div class="header">
        <span class="title">Boids</span>
        <span id="fps-badge" class="fps-badge">
          <span id="fps" class="fps-value">0</span>
          <span class="fps-unit">FPS</span>
        </span>
      </div>

      <div class="row">
        <span class="row-label">View</span>
        <div class="segmented">
          <button id="view-2d" class="segment" tabindex="-1">2D</button>
          <button id="view-3d" class="segment" tabindex="-1">3D</button>
        </div>
      </div>

      <div class="row row--slider">
        <span class="row-label">Count</span>
        <span id="boid-count" class="row-value">32</span>
      </div>
      <input
        type="range"
        id="boid-slider"
        class="boid-slider"
        min="5"
        max="16"
        step="any"
        value="5"
        tabindex="-1"
      />
      <div class="slider-range">
        <span id="boid-min">32</span>
        <span id="boid-max">65,536</span>
      </div>

      <label id="avoid-row" class="row">
        <span class="row-label">Avoid mouse</span>
        <input type="checkbox" id="avoid-toggle" class="toggle" tabindex="-1" />
      </label>

      <div id="hint" class="hint">Drag to pan · Scroll to zoom</div>
    </div>
    <a
      href="https://github.com/jtsorlinis/BoidsWebGPU"
      target="_blank"
      rel="noopener noreferrer"
      id="sourceButton"
    >
      <svg
        style="width: 24px"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 640 512"
      >
        <!--! Font Awesome Pro 6.4.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2023 Fonticons, Inc. -->

          d="M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6zm80.6 120.1c-12.5 12.5-12.5 32.8 0 45.3L562.7 256l-89.4 89.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112c-12.5-12.5-32.8-12.5-45.3 0zm-306.7 0c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256l89.4-89.4c12.5-12.5 12.5-32.8 0-45.3z"
        />
      </svg>
    </a>
    <canvas id="renderCanvas"></canvas>
  </body>
</html>
